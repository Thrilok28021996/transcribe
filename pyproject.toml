[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-agent-os"
version = "0.1.0"
description = "Neural Agent OS — Autonomous Personal Task Automation & Memory Engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Neural Agent OS Authors" }
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "rich>=13.7.0",
    "numpy>=1.24.0",
    "typing-extensions>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
]
bot = [
    "playwright>=1.40.0",
]
diarization = [
    "pyannote.audio>=3.1.0",
    "torch>=2.0.0",
]
google = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.2.0",
]
all = [
    "playwright>=1.40.0",
    "pyannote.audio>=3.1.0",
    "torch>=2.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.2.0",
]

[project.scripts]
neural-agent = "neural_agent_os.cli.main:cli"
transcribe = "neural_agent_os.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --durations=10"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
