[package]
name = "neural-agent-os-desktop"
version = "0.1.0"
description = "Transcribe AI — Local-first AI Meeting Memory Platform Desktop App"
authors = ["Transcribe AI Authors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
